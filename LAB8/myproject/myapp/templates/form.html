{% extends "base.html" %}

{% block title %}
แบบฟอร์ม | ICT12367
{% endblock %}

{% block content %}

<style>
.hero-small {
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee");
    background-size: cover;
    background-position: center;
    color: white;
    padding: 60px 20px;
    text-align: center;
    border-radius: 10px;
}

.form-container {
    max-width: 500px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

.form-container h3 {
    background: #0d6efd;
    color: white;
    padding: 10px;
    text-align: center;
    border-radius: 6px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    font-weight: bold;
}

.form-group input {
    width: 100%;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.btn-group {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}

.btn-submit {
    background: #198754;
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn-reset {
    background: #dc3545;
    color: white;
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

.btn-submit:hover {
    background: #157347;
}

.btn-reset:hover {
    background: #bb2d3b;
}
</style>

<div class="hero-small">
    <h2>แบบฟอร์มบันทึกข้อมูลประชากร</h2>
    <p>กรอกข้อมูลให้ครบถ้วนก่อนทำการส่งข้อมูล</p>
</div>

<div class="form-container">
    <h3>ลงทะเบียนข้อมูล</h3>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>ชื่อ-นามสกุล</label>
            <input type="text" name="fullname" placeholder="กรุณากรอกชื่อ-นามสกุล">
        </div>

        <div class="form-group">
            <label>อายุ</label>
            <input type="number" name="age" placeholder="กรอกอายุเป็นตัวเลข">
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-submit">ลงทะเบียน</button>
            <button type="reset" class="btn-reset">ล้างข้อมูล</button>
        </div>

    </form>
</div>

<footer style="text-align:center; margin-top:40px;">
    © 2026 ICT12367 SPU | Information Technology
</footer>

{% endblock %}
